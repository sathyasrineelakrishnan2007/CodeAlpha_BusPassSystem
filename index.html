
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Bus Pass</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #eef3ff;
  margin: 0;
  padding: 20px;
}
.container {
  max-width: 440px;
  margin: 20px auto;
  background: white;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 4px 18px #ccd3e0;
}
h1 { color: #1746a2; text-align: center; }
label { display: block; margin-top: 14px; }
input, select, button {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin-top: 6px;
  border-radius: 8px;
  border: 1px solid #bdc8dc;
}
button {
  background: #1746a2;
  color: white;
  border: none;
  margin-top: 20px;
  font-size: 16px;
}
#result {
  display: none;
  margin-top: 20px;
  padding: 15px;
  background: #e3f8eb;
  border-radius: 10px;
  overflow-wrap: anywhere;
}
</style>
</head>
<body>
<div class="container">
  <h1>🚌 Smart Bus Pass</h1>
  <p>Online Bus Pass Application</p>

  <form id="passForm">
    <label>Full Name</label>
    <input id="name" required maxlength="60">

    <label>Student ID</label>
    <input id="studentId" required maxlength="30">

    <label>From</label>
    <input id="from" required maxlength="60">

    <label>To</label>
    <input id="to" required maxlength="60">

    <label>Pass Type</label>
    <select id="passType">
      <option>Monthly</option>
      <option>Quarterly</option>
    </select>

    <button type="submit">Generate Demo Pass</button>
  </form>

  <div id="result" aria-live="polite"></div>
</div>

<script>
document.getElementById("passForm").addEventListener("submit", function(event) {
  event.preventDefault();

  const name = document.getElementById("name").value.trim();
  const studentId = document.getElementById("studentId").value.trim();
  const from = document.getElementById("from").value.trim();
  const to = document.getElementById("to").value.trim();
  const passType = document.getElementById("passType").value;

  if (!name || !studentId || !from || !to) return;

  const result = document.getElementById("result");
  result.replaceChildren();

  const heading = document.createElement("h3");
  heading.textContent = "Demo Bus Pass";
  result.appendChild(heading);

  [
    ["Name", name],
    ["Student ID", studentId],
    ["Route", from + " → " + to],
    ["Pass Type", passType],
    ["Status", "Demo only — not a valid travel pass"]
  ].forEach(function(item) {
    const p = document.createElement("p");
    p.textContent = item[0] + ": " + item[1];
    result.appendChild(p);
  });

  result.style.display = "block";
});
</script>
</body>
</html>
